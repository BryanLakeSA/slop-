<!doctype html><meta charset=utf-8><title>slop~ phase 0</title>
<style>body{font:13px sans-serif;margin:12px}textarea{width:100%;height:200px;font:12px monospace}
#drop{border:2px dashed #888;padding:14px;margin:8px 0}#err{color:#c00;white-space:pre}iframe{width:100%;height:330px;border:1px solid #888}
pre{background:#eee;padding:4px;max-height:90px;overflow:auto}</style>
<button id=start>Start audio + MIDI</button> <span id=midi></span> <code id=midilog></code>
<h3>Instrument (b)</h3><textarea id=code></textarea><br>
<button id=run>Run</button> <button id=hang>Load hanging code (g)</button> <button id=rebuild>Stop / Rebuild</button> <button id=reload>Reload window</button>
<span id=params></span><div id=err></div>
<div id=drop>Drop zone (c, d): drag a sample name here from the widget</div>
<h3>Widget (c, d, e, f)</h3><iframe id=wf sandbox="allow-scripts"></iframe><pre id=log></pre>
<script>
const $=id=>document.getElementById(id), sleep=ms=>new Promise(r=>setTimeout(r,ms));
const log=m=>$('log').textContent=m+'\n'+$('log').textContent.slice(0,1500);
const DEMO=`/*SLOP {"id":"sampler","version":1,"samples":[{"id":"main","label":"Sample"}],"params":[
{"id":"root","label":"Root","min":0,"max":127,"def":60,"type":"stepped"},
{"id":"tune","label":"Tune","min":-12,"max":12,"def":0},
{"id":"volume","label":"Volume","min":0,"max":1,"def":0.7},
{"id":"attack","label":"Attack","min":0.001,"max":5,"def":0.005,"scaling":"exponential"},
{"id":"release","label":"Release","min":0.005,"max":10,"def":0.3,"scaling":"exponential"},
{"id":"loop","label":"Loop","min":0,"max":1,"def":0,"type":"toggle"}]}*/
class Instrument extends AudioWorkletProcessor{
 constructor(){super();this.s=null;this.V=[];this.P={root:60,tune:0,volume:0.7,attack:0.005,release:0.3,loop:0};
  this.port.onmessage=({data:m})=>{
   if(m.t=='param')this.P[m.id]=m.v;
   else if(m.t=='sample')this.s={d:m.data,r:m.rate};
   else if(m.t=='on'&&this.s){if(this.V.length>=8)this.V.shift();
    this.V.push({n:m.n,v:m.v,p:0,g:0,rel:0,k:1,ai:1/(this.P.attack*sampleRate),ri:0})}
   else if(m.t=='off')this.V.forEach(x=>{if(x.n==m.n&&!x.rel){x.rel=1;x.ri=1/(this.P.release*sampleRate)}})}}
 process(_,out){const o=out[0],N=o[0].length,s=this.s,P=this.P;
  if(s&&s.d[0].length>1){const A=s.d[0],B=s.d[1]||A,L=A.length-1;
   for(const x of this.V)x.k=Math.pow(2,(x.n-P.root+P.tune)/12)*s.r/sampleRate;
   for(let i=0;i<N;i++){let l=0,r=0;
    for(const x of this.V){if(x.dead)continue;
     if(x.rel)x.g-=x.ri;else if(x.g<1)x.g=Math.min(1,x.g+x.ai);
     if(x.g<=0){x.dead=1;continue}
     if(x.p>=L){if(P.loop)x.p%=L;else{x.dead=1;continue}}
     const i0=x.p|0,f=x.p-i0,w=x.g*x.v;
     l+=(A[i0]+(A[i0+1]-A[i0])*f)*w;r+=(B[i0]+(B[i0+1]-B[i0])*f)*w;x.p+=x.k}
    o[0][i]=l*P.volume;if(o[1])o[1][i]=r*P.volume}
   this.V=this.V.filter(x=>!x.dead)}
  return true}}`;
$('code').value=DEMO;
const WIDGET=`<style>body{font:12px sans-serif;margin:6px}canvas{width:100%;height:100px;background:#111}.f{padding:3px;border:1px solid #888;margin:2px;cursor:grab}</style>
<canvas id=c width=512 height=100></canvas><br>Volume <input id=s type=range min=0 max=1 step=.001 style="width:70%"><div id=l></div>
<script>
const g=c.getContext('2d');
host.audio.subscribe('master');
host.on('audio',a=>{g.fillStyle='#111';g.fillRect(0,0,512,100);g.strokeStyle='#0f0';g.beginPath();a.forEach((y,i)=>g.lineTo(i/a.length*512,50-y*45));g.stroke()});
host.instrument.params.list().then(p=>{const v=p.find(x=>x.id=='volume');if(v)s.value=v.value});
host.instrument.params.subscribe(['volume']);
host.on('param',d=>{if(d.id=='volume')s.value=d.v});
s.oninput=()=>host.instrument.params.set('volume',+s.value);
host.samples.list('').then(f=>f.filter(x=>!x.dir).forEach(x=>{const e=document.createElement('div');e.className='f';e.textContent=x.name;e.style.touchAction='none';e.style.userSelect='none';let sx,sy,mv;
 e.onpointerdown=ev=>{e.setPointerCapture(ev.pointerId);sx=ev.clientX;sy=ev.clientY;mv=0;host.drag.start(x.name,sx,sy)};
 e.onpointermove=ev=>{if(!e.hasPointerCapture(ev.pointerId))return;if(Math.hypot(ev.clientX-sx,ev.clientY-sy)>4)mv=1;host.drag.move(ev.clientX,ev.clientY)};
 e.onpointerup=ev=>host.drag.end(ev.clientX,ev.clientY,mv);
 e.onclick=()=>{if(!mv)host.samples.audition(x.name)};l.append(e)}));
<\/script>`;
const SDK=`<script>(()=>{const h={},cb={};let n=0;
const send=(t,d)=>parent.postMessage({t,d},'*');
const req=(t,d)=>new Promise(r=>{const i=++n;cb[i]=r;parent.postMessage({t,d,i},'*')});
addEventListener('message',e=>{const m=e.data;if(m.i&&cb[m.i]){cb[m.i](m.d);delete cb[m.i]}else(h[m.t]||[]).forEach(f=>f(m.d))});
window.host={on:(t,f)=>(h[t]=h[t]||[]).push(f),send,
samples:{list:p=>req('samples.list',p),audition:p=>send('samples.audition',p)},
audio:{subscribe:s=>send('audio.subscribe',s)},
drag:{start:(p,x,y)=>send('drag.start',{p,x,y}),move:(x,y)=>send('drag.move',{x,y}),end:(x,y,mv)=>send('drag.end',{x,y,mv})},
instrument:{params:{list:()=>req('params.list'),set:(id,v)=>send('params.set',{id,v}),subscribe:ids=>send('params.subscribe',ids)}}};
})()<\/script>`;
let ctx,master,an,node,params={},nName=0,midiOk=0,feed=0,sub=0;
async function start(){
  if(ctx)await Promise.race([ctx.close().catch(()=>{}),sleep(1500)]);
  ctx=new AudioContext();master=ctx.createGain();an=ctx.createAnalyser();an.fftSize=1024;
  master.connect(an);an.connect(ctx.destination);node=null;
  if(!midiOk)try{const m=await navigator.requestMIDIAccess();const hook=()=>m.inputs.forEach(i=>i.onmidimessage=onMidi);
    hook();m.onstatechange=hook;midiOk=1;$('midi').textContent='MIDI in: '+([...m.inputs.values()].map(i=>i.name).join(', ')||'none found')}
  catch(e){$('midi').textContent='MIDI FAIL: '+e}
  log('AudioContext '+ctx.state+', '+ctx.sampleRate+' Hz');const t0=ctx.currentTime,c0=ctx;setTimeout(()=>log('Clock check: state='+c0.state+', clock advanced '+(c0.currentTime-t0).toFixed(2)+' s in 1 s'),1000);
}
function onMidi(e){const [s,a,b]=e.data,t=s&0xf0;$('midilog').textContent=[...e.data].join(' ');
  if(!node)return;if(t==0x90&&b)node.port.postMessage({t:'on',n:a,v:b/127});else if(t==0x80||t==0x90)node.port.postMessage({t:'off',n:a})}
async function run(){
  $('err').textContent='';if(!ctx)await start();
  const code=$('code').value,c=await slopHost.checkCode(code);
  if(!c.ok){$('err').textContent=`Syntax error, line ${c.line}: ${c.message}`;return}
  const name='slop-'+(++nName),url=URL.createObjectURL(new Blob([code+`\nregisterProcessor('${name}',Instrument);`],{type:'text/javascript'}));
  try{await Promise.race([ctx.audioWorklet.addModule(url),sleep(3000).then(()=>{throw new Error('addModule timed out after 3 s')})])}catch(e){$('err').textContent='Load failed: '+e.message;return}
  const man=JSON.parse((code.match(/\/\*SLOP([\s\S]*?)\*\//)||[0,'{"params":[]}'])[1]);
  if(node)node.disconnect();
  node=new AudioWorkletNode(ctx,name,{numberOfInputs:0,outputChannelCount:[2]});
  node.onprocessorerror=()=>$('err').textContent='Processor runtime error';node.connect(master);
  params={};$('params').textContent='';
  for(const p of man.params){const el=document.createElement('input');el.type='range';el.min=0;el.max=1;el.step=.001;
    const sp=document.createElement('span');params[p.id]={...p,el,sp};el.oninput=()=>setNorm(p.id,+el.value,true);
    $('params').append(' | '+p.label+' ',el,sp);setNorm(p.id,p.scaling=='exponential'?Math.log(p.def/p.min)/Math.log(p.max/p.min):(p.def-p.min)/(p.max-p.min),false)}
  slots=man.samples||[];postSample();
  log('Instrument running: '+name);
}
function setNorm(id,v,notify){const p=params[id];if(!p||!node)return;v=Math.min(1,Math.max(0,+v||0));p.norm=v;p.el.value=v;
  let a=p.scaling=='exponential'?p.min*Math.pow(p.max/p.min,v):p.min+(p.max-p.min)*v;if(p.type=='stepped'||p.type=='toggle')a=Math.round(a);
  p.sp.textContent=' '+(+a.toPrecision(3));node.port.postMessage({t:'param',id,v:a});
  if(notify&&sub)wf.contentWindow.postMessage({t:'param',d:{id,v}},'*')}
async function play(bytes){const ab=await ctx.decodeAudioData(bytes.buffer.slice(bytes.byteOffset,bytes.byteOffset+bytes.byteLength));
  const s=ctx.createBufferSource();s.buffer=ab;s.connect(master);s.start();log('Sample played, '+ab.duration.toFixed(2)+' s')}
async function sample(rel){try{if(!ctx)await start();await play(await slopHost.readSample(rel))}catch(e){log('Sample FAIL: '+e)}}
let held=null,slots=[];
async function loadSample(rel){try{const b=await slopHost.readSample(rel);const ab=await ctx.decodeAudioData(b.buffer.slice(b.byteOffset,b.byteOffset+b.byteLength));
  held={rate:ab.sampleRate,ch:Array.from({length:Math.min(2,ab.numberOfChannels)},(_,c)=>ab.getChannelData(c).slice())};postSample();
  log('Loaded into instrument: '+rel+' ('+ab.duration.toFixed(2)+' s). Play your keyboard.')}catch(e){log('Load FAIL: '+e)}}
function postSample(){if(!node||!held||!slots.length)return;const ch=held.ch.map(a=>a.slice());node.port.postMessage({t:'sample',id:slots[0].id,rate:held.rate,data:ch},ch.map(a=>a.buffer))}
let drag=null;
function endDrag(){if(drag){drag.g.remove();$('drop').style.background='';drag=null}}
function dragAt(x,y){const r=wf.getBoundingClientRect(),X=r.left+x,Y=r.top+y;
  if(!drag.out&&(x<0||y<0||x>r.width||y>r.height)){drag.out=1;log('Pointer capture OK: widget still sends moves outside its frame')}
  Object.assign(drag.g.style,{display:'block',left:X+12+'px',top:Y+12+'px'});
  const z=!!document.elementFromPoint(X,Y)?.closest('#drop');$('drop').style.background=z?'#cfc':'';return z}
addEventListener('message',async e=>{if(e.source!==wf.contentWindow)return;const {t,d,i}=e.data,rep=x=>e.source.postMessage({i,d:x},'*');
  if(t=='samples.list')rep(await slopHost.listSamples(d||''));
  else if(t=='samples.audition')sample(d);
  else if(t=='drag.start'){endDrag();const g=document.createElement('div');g.textContent=String(d.p);
    Object.assign(g.style,{position:'fixed',pointerEvents:'none',background:'#ffd',border:'1px solid #888',padding:'2px 6px',zIndex:9,display:'none'});
    document.body.append(g);drag={p:String(d.p),out:0,g}}
  else if(t=='drag.move'&&drag)dragAt(d.x,d.y);
  else if(t=='drag.end'&&drag){const z=dragAt(d.x,d.y),p=drag.p;endDrag();if(z){log('Dropped '+p);slots.length&&node?loadSample(p):sample(p)}else if(d.mv)log('Released outside the drop zone')}
  else if(t=='log')log('widget: '+d);
  else if(t=='audio.subscribe')feed=1;
  else if(t=='params.list')rep(Object.entries(params).map(([id,p])=>({id,label:p.label,min:p.min,max:p.max,value:p.norm})));
  else if(t=='params.subscribe')sub=1;
  else if(t=='params.set')setNorm(d.id,d.v,false)});
$('drop').ondragenter=()=>log('dragenter on zone');
$('drop').ondragover=e=>e.preventDefault();
$('drop').ondrop=e=>{e.preventDefault();const t=e.dataTransfer.getData('text/plain');log('Dropped token: '+t+' types='+[...e.dataTransfer.types]);if(t)sample(t)};
(function tick(){if(feed&&an){const a=new Float32Array(an.fftSize);an.getFloatTimeDomainData(a);wf.contentWindow.postMessage({t:'audio',d:a},'*')}requestAnimationFrame(tick)})();
$('start').onclick=start;$('run').onclick=run;
$('hang').onclick=()=>{$('code').value=DEMO.replace('process(_,out){','process(_,out){while(true){}')};
$('reload').onclick=()=>location.reload();
$('rebuild').onclick=async()=>{await start();$('code').value=DEMO;await run()};
wf.srcdoc=SDK+WIDGET;
</script>
